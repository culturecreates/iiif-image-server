services:
  image-server:
    build: .
    restart: always
    container_name: canataloupe-image-server
    ports:
      - "80:80"
    mem_limit: 3g
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - footlight-cms

networks:
  footlight-cms:
    external: true
